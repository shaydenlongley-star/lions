<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaydefy Outreach</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --s1: #111;
  --s2: #161616;
  --s3: #1d1d1d;
  --border: rgba(255,255,255,0.06);
  --border-md: rgba(255,255,255,0.12);
  --border-hi: rgba(255,255,255,0.2);
  --text: #E6E3DE;
  --muted: rgba(230,227,222,0.42);
  --dim: rgba(230,227,222,0.2);
  --xdim: rgba(230,227,222,0.1);
  --green: #22C55E;
  --green-bg: rgba(34,197,94,0.08);
  --green-border: rgba(34,197,94,0.22);
  --accent-t1: #818CF8;
  --accent-t2: #FBBF24;
  --accent-t3: #F87171;
  --c-email: #4285F4;
  --c-wa: #25D366;
  --c-ig: #E1306C;
  --c-line: #06C755;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh; line-height: 1;
}

/* ── Header ────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,8,8,0.96); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.logo {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text); flex-shrink: 0;
}
.logo-sub { color: var(--dim); font-weight: 300; margin-left: 10px; letter-spacing: 0.1em; font-size: 0.65rem; }

.touch-pills { display: flex; gap: 4px; }
.touch-pill {
  padding: 6px 15px; border-radius: 20px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.68rem; font-family: inherit; letter-spacing: 0.07em;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.touch-pill:hover:not(.active) { border-color: var(--border-md); color: var(--text); }
.touch-pill.active.t1 { background: var(--accent-t1); border-color: var(--accent-t1); color: #fff; font-weight: 500; }
.touch-pill.active.t2 { background: var(--accent-t2); border-color: var(--accent-t2); color: #000; font-weight: 500; }
.touch-pill.active.t3 { background: var(--accent-t3); border-color: var(--accent-t3); color: #fff; font-weight: 500; }

/* ── Toolbar ───────────────────────────────────────── */
.toolbar {
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border-bottom: 1px solid var(--border);
}
.round-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
.round-tab {
  padding: 5px 13px; border-radius: 5px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.7rem; font-family: inherit; letter-spacing: 0.08em;
  cursor: pointer; transition: all 0.15s;
}
.round-tab:hover:not(.active) { border-color: var(--border-md); color: var(--text); }
.round-tab.active { background: var(--s3); border-color: var(--border-md); color: var(--text); }

.statsbar { display: flex; gap: 20px; align-items: center; }
.stat-item { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat-val { font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.stat-lbl { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.stat-divider { width: 1px; height: 24px; background: var(--border); }

/* ── Progress strip ───────────────────────────────── */
.progress-strip { height: 2px; background: var(--border); }
.progress-fill { height: 100%; background: var(--green); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

/* ── Grid ─────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
  gap: 10px;
  padding: 18px 28px 48px;
}

/* ── Card ─────────────────────────────────────────── */
.card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color: var(--border-md); }
.card.complete {
  border-color: var(--green-border);
  box-shadow: 0 0 0 1px rgba(34,197,94,0.04) inset;
}

.card-bar { height: 3px; background: var(--border); }
.card-bar-fill { height: 100%; background: var(--green); transition: width 0.35s ease; }

.card-header {
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.card-name { font-size: 0.86rem; font-weight: 500; letter-spacing: 0.01em; }
.card-right { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
.badge {
  font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px;
}
.badge-round { color: var(--dim); border: 1px solid var(--border); }
.badge-complete { color: var(--green); border: 1px solid var(--green-border); background: var(--green-bg); }
.badge-ni { color: #F87171; border: 1px solid rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }
.card.ni { opacity: 0.45; }
.card.ni:hover { opacity: 0.7; }
.btn-ni {
  padding: 2px 8px; border-radius: 3px;
  font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--border); background: none; color: var(--dim);
  font-family: inherit; cursor: pointer; transition: all 0.15s;
}
.btn-ni:hover { border-color: rgba(248,113,113,0.4); color: #F87171; }
.btn-ni.active { border-color: rgba(248,113,113,0.3); color: #F87171; background: rgba(248,113,113,0.06); }

/* ── Reply tracking ───────────────────────────────── */
.badge-replied { color: var(--accent-t1); border: 1px solid rgba(129,140,248,0.3); background: rgba(129,140,248,0.08); }
.badge-hot     { color: #F97316; border: 1px solid rgba(249,115,22,0.3); background: rgba(249,115,22,0.08); }
.badge-maybe   { color: #A78BFA; border: 1px solid rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
.badge-dead    { color: #6B7280; border: 1px solid rgba(107,114,128,0.25); background: rgba(107,114,128,0.06); }
.card.replied  { border-color: rgba(129,140,248,0.2); }
.card.hot      { border-color: rgba(249,115,22,0.3); box-shadow: 0 0 0 1px rgba(249,115,22,0.05) inset; }

.btn-reply {
  padding: 2px 8px; border-radius: 3px;
  font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--border); background: none; color: var(--dim);
  font-family: inherit; cursor: pointer; transition: all 0.15s;
}
.btn-reply:hover { border-color: rgba(129,140,248,0.4); color: var(--accent-t1); }
.btn-reply.active { border-color: rgba(129,140,248,0.3); color: var(--accent-t1); background: rgba(129,140,248,0.08); }

.reply-panel {
  display: none; padding: 8px 16px 12px;
  border-top: 1px solid var(--border);
  flex-direction: column; gap: 9px;
  background: rgba(129,140,248,0.03);
}
.reply-panel.open { display: flex; }
.reply-row { display: flex; align-items: center; gap: 8px; }
.reply-row-label { font-size: 0.59rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); width: 56px; flex-shrink: 0; }
.reply-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.reply-chip {
  padding: 3px 10px; border-radius: 12px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.63rem; font-family: inherit; letter-spacing: 0.04em;
  cursor: pointer; transition: all 0.13s;
}
.reply-chip:hover { border-color: var(--border-md); color: var(--text); }
.reply-chip.sel-email     { border-color: rgba(66,133,244,0.45); color: var(--c-email); background: rgba(66,133,244,0.1); }
.reply-chip.sel-whatsapp  { border-color: rgba(37,211,102,0.45); color: var(--c-wa); background: rgba(37,211,102,0.1); }
.reply-chip.sel-instagram { border-color: rgba(225,48,108,0.45); color: var(--c-ig); background: rgba(225,48,108,0.1); }
.reply-chip.sel-line      { border-color: rgba(6,199,85,0.45); color: var(--c-line); background: rgba(6,199,85,0.1); }
.reply-chip.sel-hot       { border-color: rgba(249,115,22,0.4); color: #F97316; background: rgba(249,115,22,0.1); }
.reply-chip.sel-maybe     { border-color: rgba(167,139,250,0.4); color: #A78BFA; background: rgba(167,139,250,0.1); }
.reply-chip.sel-dead      { border-color: rgba(107,114,128,0.4); color: #6B7280; background: rgba(107,114,128,0.1); }

/* ── Filter tabs ──────────────────────────────────── */
.filter-tabs { display: flex; gap: 4px; }
.filter-tab {
  padding: 4px 11px; border-radius: 12px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.63rem; font-family: inherit; letter-spacing: 0.07em;
  cursor: pointer; transition: all 0.15s;
}
.filter-tab:hover:not(.active) { border-color: var(--border-md); color: var(--text); }
.filter-tab.active { background: var(--s3); border-color: var(--border-md); color: var(--text); }
.filter-tab.active.f-replied { border-color: rgba(129,140,248,0.4); color: var(--accent-t1); background: rgba(129,140,248,0.1); }
.filter-tab.active.f-hot     { border-color: rgba(249,115,22,0.4); color: #F97316; background: rgba(249,115,22,0.1); }

.channels { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 5px; }

/* ── Channel row ──────────────────────────────────── */
.ch {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 7px;
  transition: border-color 0.15s, background 0.15s;
}
.ch:hover { border-color: var(--border-md); }
.ch.sent { background: var(--green-bg); border-color: var(--green-border); }

.ch-icon {
  width: 30px; height: 30px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ch-icon svg { width: 16px; height: 16px; display: block; }
.ch-icon.email    { background: rgba(66,133,244,0.12); }
.ch-icon.whatsapp { background: rgba(37,211,102,0.12); }
.ch-icon.instagram{ background: rgba(225,48,108,0.12); }
.ch-icon.line     { background: rgba(6,199,85,0.12);  }

.ch-info { flex: 1; min-width: 0; }
.ch-label { font-size: 0.72rem; font-weight: 500; color: var(--text); line-height: 1.2; }
.ch-detail { font-size: 0.61rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch.sent .ch-label, .ch.sent .ch-detail { color: var(--dim); }

.ch-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* ── Buttons ──────────────────────────────────────── */
button { font-family: inherit; cursor: pointer; }

.btn-launch {
  padding: 5px 11px; border-radius: 5px;
  font-size: 0.66rem; font-weight: 500; letter-spacing: 0.05em;
  border: 1px solid; background: none;
  transition: all 0.15s; display: flex; align-items: center; gap: 4px;
}
.btn-launch.email     { border-color: rgba(66,133,244,0.3);  color: var(--c-email); }
.btn-launch.whatsapp  { border-color: rgba(37,211,102,0.3);  color: var(--c-wa); }
.btn-launch.instagram { border-color: rgba(225,48,108,0.3);  color: var(--c-ig); }
.btn-launch.line      { border-color: rgba(6,199,85,0.3);    color: var(--c-line); }
.btn-launch.email:hover     { background: rgba(66,133,244,0.1); }
.btn-launch.whatsapp:hover  { background: rgba(37,211,102,0.1); }
.btn-launch.instagram:hover { background: rgba(225,48,108,0.1); }
.btn-launch.line:hover      { background: rgba(6,199,85,0.1); }

.btn-icon {
  width: 28px; height: 28px; border-radius: 5px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.7rem; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--border-md); color: var(--text); }
.btn-icon.copied { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
.btn-icon.checked { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }

/* ── Notes ────────────────────────────────────────── */
.btn-icon.has-note { border-color: rgba(251,191,36,0.35); color: #FBBF24; }
.note-chip {
  display: inline-block; margin-left: 5px;
  color: #FBBF24; font-size: 0.58rem; font-style: normal;
  background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.22);
  border-radius: 3px; padding: 1px 5px; vertical-align: middle;
}
.note-row {
  display: none; padding: 6px 10px 8px 49px;
  flex-direction: column; gap: 6px;
}
.note-row.open { display: flex; }
.note-presets { display: flex; gap: 4px; flex-wrap: wrap; }
.preset-btn {
  padding: 3px 9px; border-radius: 10px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 0.6rem; font-family: inherit; letter-spacing: 0.04em;
  cursor: pointer; transition: all 0.12s;
}
.preset-btn:hover { border-color: rgba(251,191,36,0.3); color: #FBBF24; }
.note-input {
  background: none; border: none; border-bottom: 1px solid var(--border);
  color: var(--text); font-size: 0.68rem; font-family: inherit;
  padding: 3px 0; outline: none; width: 100%;
}
.note-input::placeholder { color: var(--dim); }
.note-input:focus { border-bottom-color: var(--border-md); }

/* ── Empty state ──────────────────────────────────── */
.empty { padding: 60px 28px; text-align: center; color: var(--dim); font-size: 0.78rem; letter-spacing: 0.06em; }

/* ── Color panel ──────────────────────────────────── */
.color-panel-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
}
.color-panel-overlay.open { display: flex; align-items: center; justify-content: center; }
.color-panel {
  background: #111; border: 1px solid var(--border-md);
  border-radius: 12px; width: 480px; max-width: 95vw;
  padding: 24px; display: flex; flex-direction: column; gap: 14px;
}
.cp-header { display: flex; align-items: center; justify-content: space-between; }
.cp-title { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); }
.cp-close { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; width: 28px; height: 28px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cp-close:hover { border-color: var(--border-md); color: var(--text); }
.cp-row { display: flex; gap: 10px; }
.cp-field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.cp-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.cp-input { background: var(--s2); border: 1px solid var(--border); color: var(--text); font-size: 0.72rem; font-family: inherit; padding: 7px 10px; border-radius: 5px; outline: none; width: 100%; }
.cp-input:focus { border-color: var(--border-md); }
.cp-color-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cp-color-field { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.cp-color-preview { width: 100%; height: 26px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
.cp-color-hex { width: 100%; background: var(--s2); border: 1px solid var(--border); color: var(--text); font-size: 0.6rem; font-family: 'Inter', monospace; padding: 4px 5px; border-radius: 4px; outline: none; text-align: center; }
.cp-color-hex:focus { border-color: var(--border-md); }
.cp-notes { background: var(--s2); border: 1px solid var(--border); color: var(--muted); font-size: 0.68rem; font-family: inherit; padding: 8px 10px; border-radius: 5px; outline: none; width: 100%; resize: none; height: 52px; }
.cp-notes:focus { border-color: var(--border-md); }
.cp-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cp-status { font-size: 0.66rem; color: var(--dim); flex: 1; }
.cp-status.ok { color: var(--green); }
.cp-status.err { color: #F87171; }
.btn-submit-colors { background: var(--accent-t1); color: #fff; border: none; border-radius: 6px; padding: 9px 20px; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
.btn-submit-colors:hover { opacity: 0.85; }
.btn-submit-colors:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="logo">Shaydefy</span>
    <span class="logo-sub">Outreach Launcher</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="touch-pills" id="touchPills"></div>
    <button onclick="resetSent()" style="padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:none;color:rgba(230,227,222,0.3);font-size:0.65rem;font-family:inherit;cursor:pointer;letter-spacing:0.07em;transition:all 0.15s" onmouseover="this.style.color='#F87171';this.style.borderColor='rgba(248,113,113,0.3)'" onmouseout="this.style.color='rgba(230,227,222,0.3)';this.style.borderColor='rgba(255,255,255,0.1)'">Reset Sent</button>
  </div>
</div>

<div class="toolbar">
  <div style="display:flex;flex-direction:column;gap:7px">
    <div class="round-tabs" id="roundTabs"></div>
    <div class="round-tabs" id="subTabs" style="display:none"></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="statsbar" id="statsbar"></div>
    <button onclick="openColorPanel()" style="padding:5px 13px;border-radius:5px;border:1px solid rgba(129,140,248,0.3);background:none;color:var(--accent-t1);font-size:0.68rem;font-family:inherit;cursor:pointer;letter-spacing:0.07em;transition:all 0.15s" onmouseover="this.style.background='rgba(129,140,248,0.1)'" onmouseout="this.style.background='none'">⬡ Colors</button>
  </div>
</div>

<!-- Color submission panel -->
<div class="color-panel-overlay" id="colorPanelOverlay" onclick="if(event.target===this)closeColorPanel()">
  <div class="color-panel">
    <div class="cp-header">
      <div class="cp-title">Submit Brand Colors</div>
      <button class="cp-close" onclick="closeColorPanel()">✕</button>
    </div>
    <div class="cp-row">
      <div class="cp-field">
        <div class="cp-label">Round</div>
        <input class="cp-input" id="cp-round" type="number" min="1" value="1">
      </div>
      <div class="cp-field" style="flex:3">
        <div class="cp-label">Instagram Handle</div>
        <input class="cp-input" id="cp-handle" type="text" placeholder="e.g. rattle_tattoo">
      </div>
    </div>
    <div>
      <div class="cp-label" style="margin-bottom:8px">Brand Colors</div>
      <div class="cp-color-row">
        <div class="cp-color-field">
          <div class="cp-label">Primary</div>
          <input type="color" class="cp-color-preview" id="cp-primary-picker" oninput="syncHex('primary',this.value)">
          <input class="cp-color-hex" id="cp-primary" value="#1A1A1A" oninput="syncPicker('primary',this.value)" placeholder="#1A1A1A">
        </div>
        <div class="cp-color-field">
          <div class="cp-label">Secondary</div>
          <input type="color" class="cp-color-preview" id="cp-secondary-picker" oninput="syncHex('secondary',this.value)">
          <input class="cp-color-hex" id="cp-secondary" value="#E8305A" oninput="syncPicker('secondary',this.value)" placeholder="#E8305A">
        </div>
        <div class="cp-color-field">
          <div class="cp-label">Accent</div>
          <input type="color" class="cp-color-preview" id="cp-accent-picker" oninput="syncHex('accent',this.value)">
          <input class="cp-color-hex" id="cp-accent" value="#F07820" oninput="syncPicker('accent',this.value)" placeholder="#F07820">
        </div>
        <div class="cp-color-field">
          <div class="cp-label">Bg</div>
          <input type="color" class="cp-color-preview" id="cp-bg-picker" oninput="syncHex('bg',this.value)">
          <input class="cp-color-hex" id="cp-bg" value="#F5F0E8" oninput="syncPicker('bg',this.value)" placeholder="#F5F0E8">
        </div>
        <div class="cp-color-field">
          <div class="cp-label">Text</div>
          <input type="color" class="cp-color-preview" id="cp-text-picker" oninput="syncHex('text',this.value)">
          <input class="cp-color-hex" id="cp-text" value="#1A1A1A" oninput="syncPicker('text',this.value)" placeholder="#1A1A1A">
        </div>
      </div>
    </div>
    <div class="cp-field">
      <div class="cp-label">Notes (optional)</div>
      <textarea class="cp-notes" id="cp-notes" placeholder="Logo style, feed vibe, anything Claude Code should know..."></textarea>
    </div>
    <div class="cp-footer">
      <div class="cp-status" id="cp-status">Server: checking...</div>
      <button class="btn-submit-colors" id="cp-submit" onclick="submitColors()">Submit Colors →</button>

function formatDateTab(d) {
  if (d.startsWith('round-')) return 'Round ' + d.split('-')[1];
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

// Load persisted state from server on boot (server is source of truth)
fetch('/state').then(r => r.json()).then(state => {
  Object.entries(state).forEach(([k, v]) => v ? localStorage.setItem(k, v) : localStorage.removeItem(k));
  render();
}).catch(() => render());

function sentKey(contactId, channelType, touch) {
  return `sent_${contactId}_${channelType}_t${touch || currentTouch}`;
}

function persistKey(k, v) {
  fetch('/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: k, value: v ?? null }) }).catch(() => {});
}

function isSent(cid, type) { return localStorage.getItem(sentKey(cid, type)) === '1'; }
function markSent(cid, type) {
  const k = sentKey(cid, type);
  localStorage.setItem(k, '1');
  persistKey(k, '1');
}
function toggleSent(cid, type) {
  const k = sentKey(cid, type);
  const nowSent = localStorage.getItem(k) !== '1';
  nowSent ? localStorage.setItem(k, '1') : localStorage.removeItem(k);
  persistKey(k, nowSent ? '1' : null);
  render();
}

function niKey(cid) { return `ni_${cid}`; }
function isNI(cid) { return localStorage.getItem(niKey(cid)) === '1'; }
function toggleNI(cid) {
  const k = niKey(cid);
  const now = localStorage.getItem(k) !== '1';
  now ? localStorage.setItem(k, '1') : localStorage.removeItem(k);
  persistKey(k, now ? '1' : null);
  render();
}

function resetSent() {
  if (!confirm('Clear all sent checkmarks for the current touch?')) return;
  Object.keys(localStorage).filter(k => k.startsWith(`sent_`) && k.endsWith(`_t${currentTouch}`)).forEach(k => {
    localStorage.removeItem(k);
    persistKey(k, null);
  });
  render();
}

function noteKey(cid, type) { return `note_${cid}_${type}`; }
function getNote(cid, type) { return localStorage.getItem(noteKey(cid, type)) || ''; }
function saveNote(cid, type, val) {
  const k = noteKey(cid, type);
  val.trim() ? localStorage.setItem(k, val.trim()) : localStorage.removeItem(k);
  persistKey(k, val.trim() || null);
  const btn = document.getElementById(`note-btn-${cid}-${type}`);
  if (btn) btn.classList.toggle('has-note', !!val.trim());
  const chip = document.getElementById(`chip-${cid}-${type}`);
  if (chip) { chip.textContent = val.trim(); chip.style.display = val.trim() ? '' : 'none'; }
}
function toggleNote(cid, type) {
  const row = document.getElementById(`note-row-${cid}-${type}`);
  if (!row) return;
  row.classList.toggle('open');
  if (row.classList.contains('open')) row.querySelector('.note-input').focus();
}
function applyPreset(cid, type, text) {
  const input = document.querySelector(`#note-row-${cid}-${type} .note-input`);
  if (input) { input.value = text; saveNote(cid, type, text); }
}

function toggleReply(cid) {

  now ? localStorage.setItem(k, '1') : localStorage.removeItem(k);
  persistKey(k, now ? '1' : null);
  if (!now) {
    [replyChKey(cid), replyIntKey(cid)].forEach(rk => { localStorage.removeItem(rk); persistKey(rk, null); });
  }
  render();
}

  persistKey(k, val);

}

  email: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="4" fill="none"/><path d="M4 7.5C4 6.67 4.67 6 5.5 6h13C19.33 6 20 6.67 20 7.5v9c0 .83-.67 1.5-1.5 1.5h-13C4.67 18 4 17.33 4 16.5v-9z" stroke="#4285F4" stroke-width="1.5"/><path d="M4 8l8 5 8-5" stroke="#4285F4" stroke-width="1.5" stroke-linecap="round"/></svg>`,

  instagram: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#E1306C" stroke-width="1.5" fill="#E1306C" fill-opacity="0.1"/><circle cx="12" cy="12" r="3.5" stroke="#E1306C" stroke-width="1.5"/><circle cx="17" cy="7" r="1" fill="#E1306C"/></svg>`,
  line: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="6" fill="#06C755" fill-opacity="0.15" stroke="#06C755" stroke-width="1.5"/><path d="M12 5.5C8.134 5.5 5 8.1 5 11.3c0 1.9 1.07 3.6 2.75 4.7-.12.42-.4 1.5-.46 1.73-.07.28.1.28.22.2.09-.06 1.48-.98 2.08-1.38.45.06.92.1 1.41.1 3.866 0 7-2.6 7-5.8S15.866 5.5 12 5.5z" fill="#06C755" fill-opacity="0.3" stroke="#06C755" stroke-width="1"/><path d="M9 11h1m2 0h1m-2-1.5v3" stroke="#06C755" stroke-width="1.2" stroke-linecap="round"/></svg>`,
};

const PLATFORM = {
  email:     { label: 'Email',        icon: ICONS.email,     detail: ch => ch.to },
  whatsapp:  { label: 'WhatsApp',     icon: ICONS.whatsapp,  detail: ch => '+' + ch.phone },
  instagram: { label: 'Instagram DM', icon: ICONS.instagram, detail: ch => '@' + ch.handle },
  line:      { label: 'LINE',         icon: ICONS.line,      detail: ch => ch.id },
};

function getUrl(ch, touch) {
  const msg = ch[`t${touch}`] || ch.t1;
  switch (ch.type) {
    case 'email':
      return `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(ch.to)}&su=${encodeURIComponent(ch.subject)}&body=${encodeURIComponent(msg)}`;
    case 'whatsapp':
      return `https://wa.me/${ch.phone}?text=${encodeURIComponent(msg)}`;
    case 'instagram':
      return `https://ig.me/m/${ch.handle}`;
    case 'line':
      return `line://ti/p/~@${ch.id}`;
  }
}

function needsCopy(type) { return type === 'instagram' || type === 'line'; }

// ── Actions ─────────────────────────────────────────────────────────
function launch(cid, type) {
  const ch = getChannel(cid, type);
  const msg = ch[`t${currentTouch}`] || ch.t1;
  const url = getUrl(ch, currentTouch);
  if (needsCopy(type)) {
    navigator.clipboard.writeText(msg)
      .then(() => { flashCopy(cid, type); window.open(url, '_blank'); })
      .catch(() => { window.open(url, '_blank'); });
  } else {
    window.open(url, '_blank');
  }
  markSent(cid, type);
  setTimeout(render, 300);
}

function copyMsg(cid, type) {
  const ch = getChannel(cid, type);
  const msg = ch[`t${currentTouch}`] || ch.t1;
  navigator.clipboard.writeText(msg).then(() => flashCopy(cid, type));
}

function flashCopy(cid, type) {
  const btn = document.getElementById(`copy-${cid}-${type}`);
  if (!btn) return;
  btn.textContent = '✓';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '⎘'; btn.classList.remove('copied'); }, 2000);
}

// ── Render ───────────────────────────────────────────────────────────
function setTouch(n) {
  currentTouch = n;
  document.querySelectorAll('.touch-pill').forEach((b, i) => b.classList.toggle('active', i + 1 === n));
  render();
}

function setDate(d) {
  currentDate = d;
  currentRound = 0;
  render();
}

function setRound(n) {
  currentRound = n;
  render();
}

function render() {
  const dates = [...new Set(contacts.map(c => c.date))].sort();
  const latestDate = dates[dates.length - 1];
  const activeDate = currentDate === 'latest' ? latestDate : currentDate;
  const byDate = activeDate === 'all' ? contacts : contacts.filter(c => c.date === activeDate);

  const roundsInDate = [...new Set(byDate.map(c => c.round))].sort((a,b) => a-b);
  const subTabsEl = document.getElementById('subTabs');
  if (activeDate !== 'all' && roundsInDate.length >= 1) {
    subTabsEl.style.display = '';
    subTabsEl.innerHTML =
      `<button class="round-tab ${currentRound===0?'active':''}" onclick="setRound(0)">All</button>` +
      roundsInDate.map(r => `<button class="round-tab ${currentRound===r?'active':''}" onclick="setRound(${r})">R${r}</button>`).join('');
  } else {
    subTabsEl.style.display = 'none';
  }
  const byRound = currentRound > 0 ? byDate.filter(c => c.round === currentRound) : byDate;
  let display = currentTouch > 1 ? byRound.filter(c => !isNI(c.id)) : byRound;
  if (currentFilter === 'replied') display = display.filter(c => isReplied(c.id));
  if (currentFilter === 'hot')     display = display.filter(c => getReplyInterest(c.id) === 'hot');

  const touchLabels = ['T1 · Intro', 'T2 · Follow-up'];
  const touchClasses = ['t1', 't2'];
  document.getElementById('touchPills').innerHTML = touchLabels.map((lbl, i) =>
    `<button class="touch-pill ${touchClasses[i]} ${currentTouch === i+1 ? 'active' : ''}" onclick="setTouch(${i+1})">${lbl}</button>`
  ).join('');

  document.getElementById('roundTabs').innerHTML =
    dates.map(d => `<button class="round-tab ${activeDate === d ? 'active' : ''}" onclick="setDate('${d}')">${formatDateTab(d)}</button>`).join('') +
    `<button class="round-tab ${activeDate === 'all' ? 'active' : ''}" onclick="setDate('all')">All</button>`;

  document.getElementById('filterTabs').innerHTML =
    `<button class="filter-tab ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">All</button>` +
    `<button class="filter-tab f-replied ${currentFilter==='replied'?'active':''}" onclick="setFilter('replied')">↩ Replied</button>` +
    `<button class="filter-tab f-hot ${currentFilter==='hot'?'active':''}" onclick="setFilter('hot')">🔥 Hot</button>`;

  const allInScope = currentTouch > 1 ? byRound.filter(c => !isNI(c.id)) : byRound;
  const totalCh = display.flatMap(c => c.channels).length;
  const sentCh = display.flatMap(c => c.channels.map(ch => isSent(c.id, ch.type) ? 1 : 0)).reduce((a,b)=>a+b, 0);
  const pct = totalCh ? Math.round(sentCh / totalCh * 100) : 0;
  const repliedCount = allInScope.filter(c => isReplied(c.id)).length;
  const hotCount = allInScope.filter(c => getReplyInterest(c.id) === 'hot').length;
  document.getElementById('statsbar').innerHTML = `
    <div class="stat-item"><div class="stat-val">${allInScope.length}</div><div class="stat-lbl">Contacts</div></div>
    <div class="stat-divider"></div>
    <div class="stat-item"><div class="stat-val">${sentCh}<span style="font-size:0.7rem;font-weight:400;color:var(--dim)"> / ${totalCh}</span></div><div class="stat-lbl">Sent</div></div>
    <div class="stat-divider"></div>
    <div class="stat-item"><div class="stat-val" style="color:${pct===100?'var(--green)':'var(--text)'}">${pct}%</div><div class="stat-lbl">Done</div></div>
    <div class="stat-divider"></div>
    <div class="stat-item"><div class="stat-val" style="color:${repliedCount>0?'var(--accent-t1)':'var(--text)'}">${repliedCount}</div><div class="stat-lbl">Replied</div></div>
    <div class="stat-divider"></div>
    <div class="stat-item"><div class="stat-val" style="color:${hotCount>0?'#F97316':'var(--text)'}">${hotCount}</div><div class="stat-lbl">Hot</div></div>`;

  document.getElementById('progressFill').style.width = pct + '%';

  document.getElementById('grid').innerHTML = display.map(c => {
    const total = c.channels.length;
    const sent = c.channels.filter(ch => isSent(c.id, ch.type)).length;
    const complete = sent === total;
    const barPct = total ? Math.round(sent / total * 100) : 0;

    const rows = c.channels.map(ch => {
      const p = PLATFORM[ch.type];
      const chSent = isSent(c.id, ch.type);
      const hasCopy = needsCopy(ch.type);
      const actionLabel = ch.type === 'email' ? 'Open Gmail' : ch.type === 'whatsapp' ? 'Open WhatsApp' : ch.type === 'instagram' ? 'Copy & Open IG' : 'Copy & Open LINE';

      const note = getNote(c.id, ch.type);
      const presets = ['Inactive', 'No account', 'No reply', 'Wrong number', 'Already has site'];

      return `<div class="ch ${chSent ? 'sent' : ''}">
        <div class="ch-icon ${ch.type}" title="${p.label}">${p.icon}</div>
        <div class="ch-info">
          <div class="ch-label">${p.label}</div>
          <div class="ch-detail">${p.detail(ch)}<span class="note-chip" id="chip-${c.id}-${ch.type}" style="${note ? '' : 'display:none'}">${note}</span></div>
        </div>
        <div class="ch-actions">
          <button class="btn-launch ${ch.type}" onclick="launch(${c.id},'${ch.type}')">${actionLabel} →</button>
          ${hasCopy ? `<button class="btn-icon" id="copy-${c.id}-${ch.type}" title="Copy message only" onclick="copyMsg(${c.id},'${ch.type}')">⎘</button>` : ''}
          <button class="btn-icon ${note ? 'has-note' : ''}" id="note-btn-${c.id}-${ch.type}" title="Add note" onclick="toggleNote(${c.id},'${ch.type}')">✎</button>
          <button class="btn-icon ${chSent ? 'checked' : ''}" title="${chSent ? 'Undo' : 'Mark sent'}" onclick="toggleSent(${c.id},'${ch.type}')">${chSent ? '✓' : '○'}</button>
        </div>
      </div>
      <div class="note-row" id="note-row-${c.id}-${ch.type}">
        <div class="note-presets">${presets.map(t => `<button class="preset-btn" onclick="applyPreset(${c.id},'${ch.type}','${t}')">${t}</button>`).join('')}</div>
        <input class="note-input" value="${note}" placeholder="or type a custom note..."
          oninput="saveNote(${c.id},'${ch.type}',this.value)">
      </div>`;
    }).join('');

    const ni = isNI(c.id);
    const replied = isReplied(c.id);
    const replyCh = getReplyChannel(c.id);
    const replyInt = getReplyInterest(c.id);
    const chTypes = c.channels.map(ch => ch.type);
    const intLabels = { hot: '🔥 Interested', maybe: '↩ Maybe', dead: '✕ Dead' };
    const replyBadge = replyInt === 'hot' ? '<span class="badge badge-hot">🔥 Hot</span>'
      : replyInt === 'maybe' ? '<span class="badge badge-maybe">↩ Maybe</span>'
      : replyInt === 'dead' ? '<span class="badge badge-dead">✕ Dead</span>'
      : replied ? '<span class="badge badge-replied">Replied</span>' : '';

    const replyPlatformChips = chTypes.map(t => {
      const sel = replyCh === t ? `sel-${t}` : '';
      const lbl = { email:'Email', whatsapp:'WhatsApp', instagram:'Instagram', line:'LINE' }[t];
      return `<button class="reply-chip ${sel}" onclick="setReplyChannel(${c.id},'${t}')">${lbl}</button>`;
    }).join('');

    const interestChips = ['hot','maybe','dead'].map(lvl => {
      const sel = replyInt === lvl ? `sel-${lvl}` : '';
      return `<button class="reply-chip ${sel}" onclick="setReplyInterest(${c.id},'${lvl}')">${intLabels[lvl]}</button>`;
    }).join('');

    const cardClass = `card ${complete ? 'complete' : ''} ${ni ? 'ni' : ''} ${replyInt === 'hot' ? 'hot' : replied ? 'replied' : ''}`;
    return `<div class="${cardClass}">
      <div class="card-bar"><div class="card-bar-fill" style="width:${barPct}%"></div></div>
      <div class="card-header">
        <div class="card-name">${c.name}</div>
        <div class="card-right">
          ${replyBadge}
          ${!replied && !ni ? (complete ? '<span class="badge badge-complete">Done</span>' : `<span style="font-size:0.62rem;color:var(--muted)">${sent}/${total}</span>`) : ''}
          <span class="badge badge-round">R${c.round}</span>
          <button class="btn-reply ${replied ? 'active' : ''}" onclick="toggleReplyPanel(${c.id})" title="Log reply">↩</button>
          <button class="btn-ni ${ni ? 'active' : ''}" onclick="toggleNI(${c.id})" title="${ni ? 'Undo' : 'Mark not interested'}">${ni ? '✕ undo' : '✕'}</button>
        </div>
      </div>
      <div class="channels">${rows}</div>
      <div class="reply-panel ${replied ? 'open' : ''}" id="reply-panel-${c.id}">
        <div class="reply-row">
          <div class="reply-row-label">Platform</div>
          <div class="reply-chips">${replyPlatformChips}</div>
        </div>
        <div class="reply-row">
          <div class="reply-row-label">Interest</div>
          <div class="reply-chips">${interestChips}</div>
        </div>
        <div style="display:flex;gap:6px;margin-top:2px">
          <button class="reply-chip ${replied ? 'sel-hot' : ''}" style="font-size:0.6rem;${replied?'border-color:rgba(34,197,94,0.4);color:var(--green);background:var(--green-bg)':''}" onclick="toggleReply(${c.id})">${replied ? '✓ Marked as replied — click to undo' : '+ Mark as replied'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

render();

// ── Color panel ─────────────────────────────────────────────────────
function openColorPanel() {
  document.getElementById('colorPanelOverlay').classList.add('open');
  document.getElementById('cp-round').value = '';
  checkServer();
  syncAllPickers();
}
function closeColorPanel() {
  document.getElementById('colorPanelOverlay').classList.remove('open');
}

function syncHex(key, val) {
  const el = document.getElementById(`cp-${key}`);
  if (el) el.value = val;
}
function syncPicker(key, val) {
  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    const el = document.getElementById(`cp-${key}-picker`);
    if (el) el.value = val;
  }
}
function syncAllPickers() {
  ['primary','secondary','accent','bg','text'].forEach(k => {
    const hex = document.getElementById(`cp-${k}`).value;
    if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
      document.getElementById(`cp-${k}-picker`).value = hex;
    }
  });
}

function checkServer() {
  const status = document.getElementById('cp-status');
  status.className = 'cp-status';
  status.textContent = 'Server: checking...';
  fetch('http://127.0.0.1:3457/health')
    .then(r => r.json())
    .then(() => { status.className = 'cp-status ok'; status.textContent = 'Server: ready ✓'; })
    .catch(() => { status.className = 'cp-status err'; status.textContent = 'Server offline — run: node color-server.cjs'; });
}

function submitColors() {
  const round = parseInt(document.getElementById('cp-round').value);
  const handle = document.getElementById('cp-handle').value.trim();
  const primary = document.getElementById('cp-primary').value.trim();
  const secondary = document.getElementById('cp-secondary').value.trim();
  const accent = document.getElementById('cp-accent').value.trim();
  const bg = document.getElementById('cp-bg').value.trim();
  const text = document.getElementById('cp-text').value.trim();
  const notes = document.getElementById('cp-notes').value.trim();

  if (!handle) { setStatus('err', 'Enter an Instagram handle'); return; }

  const btn = document.getElementById('cp-submit');
  btn.disabled = true;
  setStatus('', 'Submitting...');

  const payload = { round, handle, colors: { primary, secondary, accent, bg, text, notes } };

  // Always save to localStorage as backup
  const lsKey = `colors_r${round}_${handle}`;
  localStorage.setItem(lsKey, JSON.stringify(payload));

  fetch('http://127.0.0.1:3457/colors', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      setStatus('ok', `Submitted ✓ — ${d.file}`);
      btn.disabled = false;
    } else {
      setStatus('err', 'Server error'); btn.disabled = false;
    }
  })
  .catch(() => {
    setStatus('err', 'Server offline — saved to localStorage. Start server and resubmit.');
    btn.disabled = false;
  });
}

function setStatus(cls, msg) {
  const el = document.getElementById('cp-status');
  el.className = 'cp-status' + (cls ? ' ' + cls : '');
  el.textContent = msg;
}
</script>
</body>
</html>
