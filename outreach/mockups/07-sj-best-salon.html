<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>SJ Best Salon — Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #f7f4f0; font-family: 'Inter', sans-serif; }

  .hero { width: 100%; height: 100%; display: grid; grid-template-columns: 1.1fr 0.9fr; position: relative; }

  .left {
    background: #f7f4f0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 60px 80px 100px;
    position: relative;
  }

  .right {
    background: #1c1a17;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .right img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.5) saturate(0.6);
  }
  .right::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(247,244,240,0.08) 0%, transparent 30%),
                linear-gradient(0deg, rgba(28,26,23,0.6) 0%, transparent 40%);
    z-index: 2;
  }

  /* Stars badge */
  .stars-badge {
    position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    z-index: 5; text-align: center;
    border: 1px solid rgba(28,26,23,0.1);
    padding: 18px 22px;
    background: #f7f4f0;
  }
  .stars { color: #c8a43a; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 4px; }
  .stars-num { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: #1c1a17; line-height: 1; }
  .stars-label { color: rgba(28,26,23,0.4); font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 4px; }

  nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 80px 28px 100px;
    background: rgba(247,244,240,0.97);
    border-bottom: 1px solid rgba(28,26,23,0.06);
  }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400; color: #1c1a17; letter-spacing: 0.12em; }
  .logo em { font-style: italic; color: #c8a43a; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a { color: rgba(28,26,23,0.38); font-size: 0.72rem; letter-spacing: 0.1em; text-decoration: none; }
  .nav-cta { background: #1c1a17; color: #f7f4f0; padding: 10px 22px; font-size: 0.7rem; letter-spacing: 0.1em; border: none; cursor: pointer; }

  .eyebrow { color: #c8a43a; font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 18px; opacity: 0.8; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4.5rem; font-weight: 300; line-height: 1.08;
    color: #1c1a17; margin-bottom: 18px;
  }
  h1 em { font-style: italic; color: #c8a43a; }

  .rule { width: 36px; height: 1px; background: rgba(200,164,58,0.4); margin-bottom: 18px; }

  p { color: rgba(28,26,23,0.5); font-size: 0.91rem; line-height: 1.8; max-width: 380px; margin-bottom: 36px; font-weight: 300; }

  .actions { display: flex; gap: 12px; margin-bottom: 32px; }
  .btn-primary { background: #1c1a17; color: #f7f4f0; padding: 14px 30px; font-size: 0.72rem; letter-spacing: 0.12em; border: none; cursor: pointer; }
  .btn-ghost { border: 1px solid rgba(28,26,23,0.15); color: rgba(28,26,23,0.5); padding: 14px 30px; font-size: 0.72rem; letter-spacing: 0.12em; background: none; cursor: pointer; }

  .services { display: flex; gap: 8px; }
  .service { border: 1px solid rgba(200,164,58,0.25); color: rgba(28,26,23,0.4); padding: 5px 12px; font-size: 0.61rem; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="hero">
  <nav>
    <div class="logo">SJ <em>Best</em> Salon</div>
    <div class="nav-links">
      <a href="#">Services</a>
      <a href="#">Gallery</a>
      <a href="#">Team</a>
      <a href="#">Book</a>
    </div>
    <button class="nav-cta">Book Now</button>
  </nav>

  <div class="left">
    <div class="eyebrow">Charoen Krung · Bangkok</div>
    <h1>Hair that<br>turns <em>heads</em><br>in Bangkok.</h1>
    <div class="rule"></div>
    <p>Charoen Krung's top-rated hair salon. Cuts, colour, and treatments delivered by stylists who know what they're doing — every single time.</p>
    <div class="actions">
      <button class="btn-primary">Book a Session</button>
      <button class="btn-ghost">Our Services</button>
    </div>
    <div class="services">
      <div class="service">Cuts</div>
      <div class="service">Colour</div>
      <div class="service">Keratin</div>
      <div class="service">Perms</div>
    </div>
  </div>

  <div class="right">
    <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=1200&q=80" alt="SJ Best Salon">
    <div class="stars-badge">
      <div class="stars">★★★★★</div>
      <div class="stars-num">4.9</div>
      <div class="stars-label">Google Rating</div>
    </div>
  </div>
</div>
</body>
</html>
