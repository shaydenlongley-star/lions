function getKey(contactId, channelType) {
  return `sent_${contactId}_${channelType}_t${currentTouch}`;
}

function isSent(contactId, channelType) {
  return localStorage.getItem(getKey(contactId, channelType)) === '1';
}

function markSent(contactId, channelType) {
  localStorage.setItem(getKey(contactId, channelType), '1');
}

function toggleSent(contactId, channelType) {
  const key = getKey(contactId, channelType);
  if (localStorage.getItem(key) === '1') localStorage.removeItem(key);
  else localStorage.setItem(key, '1');
  render();
}

// ── Platform URLs ──────────────────────────────────────────────────
function getUrl(ch, touch) {
  const msg = ch[`t${touch}`] || ch.t1;
  switch (ch.type) {
    case 'email':
      return `mailto:${ch.to}?subject=${encodeURIComponent(ch.subject)}&body=${encodeURIComponent(msg)}`;
    case 'whatsapp':
      return `https://wa.me/${ch.phone}?text=${encodeURIComponent(msg)}`;
    case 'instagram':
      return `https://ig.me/m/${ch.handle}`;
    case 'line':
      return `https://line.me/ti/p/~${ch.id}`;
  }
}

function getLabel(ch) {
  const labels = { email:'Email', whatsapp:'WhatsApp', instagram:'Instagram DM', line:'LINE' };
  return labels[ch.type];
}

function iconHtml(type) {
  const icons = { email:'✉', whatsapp:'W', instagram:'IG', line:'L' };
  return `<div class="icon icon-${type}">${icons[type]}</div>`;
}

function needsCopy(type) {
  return type === 'instagram' || type === 'line';
}

// ── Render ─────────────────────────────────────────────────────────
function setTouch(n) {
  currentTouch = n;
  document.querySelectorAll('.touch-btn').forEach((b, i) => b.classList.toggle('active', i+1 === n));
  render();
}

function setRound(r) {
  currentRound = r;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', parseInt(b.dataset.round) === r));
  render();
}

function render() {
  const filtered = contacts.filter(c => c.round === currentRound);
  const rounds = [...new Set(contacts.map(c => c.round))].sort();

  // Tabs
  document.getElementById('tabs').innerHTML = rounds.map(r =>
    `<button class="tab ${r === currentRound ? 'active' : ''}" data-round="${r}" onclick="setRound(${r})">Round ${r}</button>`
  ).join('') + `<button class="tab ${currentRound===0?'active':''}" onclick="setRound(0)">All</button>`;

  // Stats
  const display = currentRound === 0 ? contacts : filtered;
  const allCh = display.flatMap(c => c.channels);
  const sentCount = allCh.filter(ch => {
    const c = display.find(x => x.channels.includes(ch));
    return c && isSent(c.id, ch.type);
  }).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat">Contacts: <span>${display.length}</span></div>
     <div class="stat">Channels: <span>${allCh.length}</span></div>
     <div class="stat">Sent: <span>${sentCount} / ${allCh.length}</span></div>`;

  // Cards
  document.getElementById('grid').innerHTML = display.map(c => {
    const totalCh = c.channels.length;
    const sentCh = c.channels.filter(ch => isSent(c.id, ch.type)).length;
    const dots = Array.from({length: totalCh}, (_, i) =>
      `<div class="prog-dot ${i < sentCh ? 'done' : ''}"></div>`).join('');

    const channelRows = c.channels.map(ch => {
      const sent = isSent(c.id, ch.type);
      const msg = ch[`t${currentTouch}`] || ch.t1;
      const url = getUrl(ch, currentTouch);
      const copyNeeded = needsCopy(ch.type);

      const mainBtn = `<button class="ch-btn ${sent ? 'sent' : ''}"
        onclick="launch('${c.id}','${ch.type}','${encodeURIComponent(url)}','${encodeURIComponent(msg)}')">
        ${iconHtml(ch.type)} ${getLabel(ch)} ${sent ? '✓' : ''}
      </button>`;

      const copyBtn = copyNeeded
        ? `<button class="copy-btn" id="copy-${c.id}-${ch.type}"
            onclick="copyMsg('${c.id}','${ch.type}','${encodeURIComponent(msg)}')">Copy</button>`
        : '';

      const sentBtn = `<button class="sent-mark" onclick="toggleSent(${c.id},'${ch.type}')" title="${sent ? 'Undo' : 'Mark sent'}">${sent ? '✓' : '○'}</button>`;

      return `<div class="ch-row">${mainBtn}${copyBtn}${sentBtn}</div>`;
    }).join('');

    return `<div class="card">
      <div class="card-head">
        <div class="card-name">${c.name}</div>
        <div class="card-round">R${c.round} · #${c.id}</div>
      </div>
      <div class="card-progress">${dots}</div>
      <div class="channels">${channelRows}</div>
    </div>`;
  }).join('');
}

function launch(id, type, encodedUrl, encodedMsg) {
  const url = decodeURIComponent(encodedUrl);
  const msg = decodeURIComponent(encodedMsg);
  if (needsCopy(type)) {
    navigator.clipboard.writeText(msg).then(() => {
      const btn = document.getElementById(`copy-${id}-${type}`);
      if (btn) { btn.textContent = 'Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000); }
      window.open(url, '_blank');
    }).catch(() => { window.open(url, '_blank'); });
  } else {
    window.open(url, '_blank');
  }
  markSent(id, type);
  setTimeout(render, 500);
}

function copyMsg(id, type, encodedMsg) {
  const msg = decodeURIComponent(encodedMsg);
  navigator.clipboard.writeText(msg).then(() => {
    const btn = document.getElementById(`copy-${id}-${type}`);
    if (btn) { btn.textContent = 'Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000); }
  });
}

render();
</script>
</body>
</html>
